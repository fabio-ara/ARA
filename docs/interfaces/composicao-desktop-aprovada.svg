<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Composição desktop aprovada do ARA</title><desc id="desc">Esquema da interface desktop aprovada: painel esquerdo com pastas e cursos visíveis ao usuário e área principal com grafo de revisões completas do curso selecionado. O esquema não define estilo final nem detalhes de implementação.</desc><style>text{font-family:system-ui,sans-serif;fill:#111}.title{font-size:26px;font-weight:700}.section{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px}.box{fill:#fff;stroke:#111;stroke-width:2}.soft{fill:#f4f4f4;stroke:#555;stroke-width:1.5}.node{fill:#fff;stroke:#111;stroke-width:2}.edge{stroke:#111;stroke-width:2;fill:none}</style><rect width="1200" height="720" fill="#fff"/><text x="40" y="48" class="title">ARA - composição desktop aprovada</text><rect x="35" y="80" width="300" height="560" rx="12" class="soft"/><text x="60" y="118" class="section">Pastas e cursos visíveis</text><rect x="55" y="145" width="260" height="54" rx="8" class="box"/><text x="75" y="178" class="body">Pasta: Estudos atuais</text><rect x="75" y="215" width="220" height="58" rx="8" class="box"/><text x="95" y="249" class="body">Curso A</text><rect x="75" y="287" width="220" height="58" rx="8" class="box"/><text x="95" y="321" class="body">Curso B</text><rect x="55" y="373" width="260" height="54" rx="8" class="box"/><text x="75" y="406" class="body">Pasta: Referências</text><rect x="75" y="443" width="220" height="58" rx="8" class="box"/><text x="95" y="477" class="body">Curso C</text><text x="60" y="592" class="small">A lista representa os cursos que o usuário pode ver.</text><rect x="365" y="80" width="800" height="560" rx="12" class="box"/><text x="395" y="118" class="section">Curso selecionado: grafo de revisões</text><text x="395" y="146" class="small">Cada nó representa uma revisão completa e utilizável do curso.</text><rect x="420" y="245" width="150" height="70" rx="12" class="node"/><text x="455" y="278" class="body">Revisão 1</text><text x="447" y="299" class="small">curso completo</text><rect x="650" y="190" width="150" height="70" rx="12" class="node"/><text x="685" y="223" class="body">Revisão 2</text><text x="677" y="244" class="small">curso completo</text><rect x="650" y="355" width="150" height="70" rx="12" class="node"/><text x="685" y="388" class="body">Revisão 3</text><text x="677" y="409" class="small">curso completo</text><rect x="900" y="270" width="150" height="70" rx="12" class="node"/><text x="935" y="303" class="body">Revisão 4</text><text x="927" y="324" class="small">curso completo</text><path d="M570 270 C610 270 610 225 650 225" class="edge"/><path d="M570 290 C610 300 610 390 650 390" class="edge"/><path d="M800 225 C850 225 850 285 900 300" class="edge"/><path d="M800 390 C850 390 850 325 900 310" class="edge"/><text x="405" y="510" class="body">Módulos, lições, microssequências, cards e recursos permanecem versionados,</text><text x="405" y="534" class="body">mas são apresentados por hierarquia, composição, diferenças e proveniência,</text><text x="405" y="558" class="body">sem grafos principais recursivos.</text><line x1="35" y1="666" x2="1165" y2="666" stroke="#777"/><text x="40" y="695" class="small">Representação esquemática de DEC-003 e DEC-004. Não define estilo visual, biblioteca de grafos, layout final, interações, permissões ou implementação.</text></svg>