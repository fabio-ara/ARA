schema_version: 1
project: ARA
language: pt-BR
source_of_truth: true

states:
  - captured
  - pending_research
  - under_review
  - pending_owner_approval
  - approved
  - rejected
  - deferred
  - superseded
  - implementation_ready
  - implemented
  - validated

items:
  - id: GOV-001
    type: governance
    title: Adotar método canônico de pesquisa, decisão e documentação
    status: approved
    summary: >-
      Manter uma única estrutura coerente para registrar questões, evidências,
      alternativas, decisões, requisitos, critérios de aceite, implementação e validação.
    decision_refs:
      - DEC-001
    acceptance_criteria:
      - Existe um único backlog canônico.
      - Decisões aprovadas atualizam todas as fontes afetadas.
      - Questões encerradas não permanecem abertas em documentos vigentes.

  - id: LANG-001
    type: documentation
    title: Adotar português do Brasil como língua canônica
    status: approved
    summary: >-
      Escrever a documentação em português do Brasil, com precisão técnica nas
      áreas de computação e educação e explicação didática para leitores de formações distintas.
    decision_refs:
      - DEC-002
    acceptance_criteria:
      - Não existem versões canônicas concorrentes em outros idiomas.
      - Termos estrangeiros necessários são definidos na primeira ocorrência relevante.

  - id: LANG-002
    type: documentation
    title: Definir o escopo futuro de localização e documentação por jurisdição
    status: captured
    summary: >-
      Investigar separadamente os idiomas da interface, a relação entre idioma da
      interface e idioma dos cursos, a localização de documentos públicos e o
      tratamento de textos jurídicos e metadados bibliográficos segundo sua fonte
      ou jurisdição. Esta pendência não altera o português do Brasil como idioma
      canônico da documentação atual.
    next_action: >-
      Organizar alternativas, públicos, custos de manutenção e critérios para futura decisão.

  - id: SCOPE-001
    type: product
    title: Adotar a tese de produto e a continuidade funcional do ARA
    status: approved
    summary: >-
      Tratar o ARA como sucessor direto do AraLearn e como plataforma educacional
      aberta, configurável, mobile-first e preparada para funcionamento offline,
      preservando a experiência anterior como referência funcional e caso de contraste,
      sem copiar automaticamente sua arquitetura interna.
    decision_refs:
      - DEC-006
    acceptance_criteria:
      - A apresentação pública identifica a continuidade funcional do projeto.
      - A configuração anterior não é tratada como regra universal.
      - A inspeção, a aprovação e a publicação permanecem sob controle humano.

  - id: SCOPE-002
    type: governance
    title: Manter o projeto em pré-desenvolvimento até decisão explícita
    status: approved
    summary: >-
      Separar pesquisa, definição do produto e exploração de design de qualquer
      programa de implementação. A entrada em desenvolvimento exige decisão explícita,
      revisão das bases vigentes, seleção do primeiro recorte e criação de itens executáveis novos.
    decision_refs:
      - DEC-007
    acceptance_criteria:
      - Nenhum rascunho, protótipo ou item candidato autoriza implementação.
      - A visão integral, o primeiro recorte, a avaliação acadêmica e a adoção institucional permanecem distintos.
      - Itens de implementação possuem requisitos, dependências e critérios de aceite atuais.

  - id: SCOPE-003
    type: research
    title: Refinar o enquadramento acadêmico do gênero do ARA
    status: captured
    summary: >-
      Examinar categorias vizinhas sem reduzir o ARA a uma plataforma de flashcards.
      O enquadramento exploratório como ambiente aberto e configurável de aprendizagem
      e autoria de recursos estruturados e interativos permanece hipótese descritiva,
      não categoria bibliométrica estabelecida nem alegação de efetividade.
    next_action: >-
      Comparar a terminologia com literatura, capacidades confirmadas e futuros objetivos acadêmicos.

  - id: SCOPE-004
    type: product
    title: Definir limites do produto, vocabulário público e cenários de referência
    status: captured
    summary: >-
      Distinguir o ARA de um LMS completo, uma suíte genérica de autoria, um banco
      de questões, uma plataforma exclusiva de pesquisa ou um simples repositório
      de conteúdo. Definir termos públicos compreensíveis e manter cenários de
      referência para estudo autodirigido offline, autoria assistida, ensino e
      tutoria, pesquisa comparativa, instituição confidencial e publicação aberta.
    next_action: >-
      Organizar alternativas, funções excluídas por padrão e terminologia para decisão do responsável pelo projeto.

  - id: SCOPE-005
    type: product
    title: Avaliar extensibilidade governada em camadas
    status: pending_research
    summary: >-
      Avaliar a recomendação de combinar um núcleo educacional pequeno e reconhecível
      com camadas explícitas de configuração e pesquisa, separando representações,
      práticas, instrumentos e capacidades opcionais. A recomendação ainda não é
      decisão de produto nem autorização para criar uma plataforma universal de componentes.
    alternatives:
      - Restringir a parametrização às capacidades já demonstradas pela experiência anterior.
      - Projetar primeiro uma plataforma universal de componentes.
      - Adotar um ecossistema educacional existente como identidade central do produto.
      - Usar extensibilidade governada e incorporar capacidades somente após necessidade demonstrada.
    next_action: >-
      Comparar valor, complexidade, manutenção, acessibilidade, funcionamento offline e adequação à autoria assistida.

  - id: SCOPE-006
    type: governance
    title: Revisar candidatos amplos antes de promovê-los
    status: captured
    summary: >-
      Propostas preliminares de produto podem ser mais amplas do que qualquer primeiro
      recorte implementável. Antes de promover um candidato, revisar limites do produto,
      primeiro perfil-alvo, relação com capacidades já confirmadas, necessidade de
      pesquisa adicional, dependências conceituais e artefatos de apoio que precisem
      ser preservados no repositório público.
    next_action: >-
      Examinar cada candidato de forma autônoma e registrar sua promoção, rejeição, adiamento ou necessidade de pesquisa, sem aprovação por ausência de contestação.

  - id: UX-001
    type: ux
    title: Adotar interface desktop com navegação à esquerda e grafo ao centro
    status: approved
    summary: >-
      Na visualização desktop, apresentar pastas e cursos visíveis no painel
      esquerdo e o grafo de revisões do curso selecionado na área principal.
    decision_refs:
      - DEC-003
    acceptance_criteria:
      - O painel esquerdo apresenta pastas e cursos visíveis ao usuário.
      - A área principal apresenta o grafo do curso selecionado.
      - A composição funciona em navegador desktop.

  - id: UX-002
    type: ux
    title: Definir arquitetura de informação responsiva e divulgação progressiva
    status: pending_research
    summary: >-
      Investigar uma arquitetura orientada às tarefas e perguntas do usuário, com
      capacidades avançadas expostas progressivamente. A proposta histórica de destinos
      dependentes de papel ou capacidade, uma tarefa primária por visualização móvel e
      painéis contextuais no desktop permanece alternativa de desenho, não navegação
      aprovada. A exploração de grafos extensos deve investigar projeções orientadas à
      tarefa, filtros e agrupamentos que reduzam o conjunto visível sem alterar o grafo
      canônico. Painel contextual, noção de revisão atual por contexto e demais mecanismos
      permanecem candidatos. Qualquer solução deve respeitar UX-001, DEC-003 e DEC-004.
    alternatives:
      - Usar Mermaid para trajetórias pequenas e predominantemente de leitura.
      - Usar Cytoscape.js com layout de DAG para exploração de linhagens e filtros.
      - Usar React Flow combinado a ELK para nós ricos e superfícies de autoria.
    next_action: >-
      Comparar navegação, divulgação progressiva e projeções de grafo com tarefas
      representativas, acessibilidade, dispositivos móveis, compreensão dos usuários,
      navegação por teclado, acesso não visual, pan e zoom, integração com diferenças
      entre revisões, consumo de memória e testes indicativos com 100, 1.000 e 10.000
      revisões. Nenhum renderizador ou mecanismo de layout está selecionado.

  - id: UX-003
    type: ux
    title: Definir estados transversais, recuperação e transparência operacional
    status: pending_research
    summary: >-
      Investigar como estados offline, sincronização, conflito, permissão, capacidade
      indisponível e falha devem aparecer de forma explícita e recuperável. Ações
      consequenciais devem tornar visíveis alvo, versão, efeito, autoridade e
      reversibilidade; falhas devem preservar trabalho e oferecer recuperação
      compreensível; operações essenciais não devem depender apenas de cor, hover ou
      arraste. Esses elementos são candidatos de UX e acessibilidade, não contratos de tela.
    next_action: >-
      Articular os candidatos com PED-004, VAL-001, versionamento, colaboração e acesso
      e sincronização, convertendo-os em invariantes testáveis e cenários de avaliação
      antes de aprovar telas, mensagens ou transições.

  - id: UX-004
    type: accessibility
    title: Definir baseline transversal de acessibilidade e sistema de design
    status: pending_research
    summary: >-
      Investigar um baseline de interface que combine HTML semântico, navegação por
      teclado e foco previsível, reflow e zoom, alternativas sem arraste e não visuais
      para estruturas bidimensionais, rótulos persistentes, erros descritivos, suporte
      a redução de movimento, contraste e semântica não dependente apenas de cor. O
      sistema de design candidato também propõe breakpoints orientados pelo conteúdo,
      comandos que explicitem objeto e consequência e densidade adequada à tarefa. O
      alvo histórico WCAG 2.2 AA, a preferência por controles de 44 px, espaçamentos,
      tokens e catálogo de componentes são referências a validar, não requisitos aprovados.
    next_action: >-
      Confrontar padrões de acessibilidade, tecnologias assistivas, navegadores,
      dispositivos, famílias de interação, requisitos de localização e linguagem da
      interface antes de aprovar limiares, tokens, componentes ou regras visuais.

  - id: VER-001
    type: product
    title: Renderizar o grafo principal somente no nível do curso
    status: approved
    summary: >-
      Cada nó do grafo principal representa uma revisão completa do curso.
      Módulos, lições, microssequências, cards e recursos permanecem versionados,
      mas são apresentados por hierarquia, composição, diferenças e proveniência.
    decision_refs:
      - DEC-004
    acceptance_criteria:
      - O grafo principal contém apenas revisões de curso.
      - Níveis internos são navegáveis e comparáveis sem grafos principais recursivos.
      - Derivações e consolidações permanecem representáveis no grafo do curso.

  - id: PROV-001
    type: product
    title: Distinguir histórico deliberativo e histórico materializado
    status: approved
    summary: >-
      Alterações efetivamente aplicadas ao curso geram novas revisões. Propostas,
      decisões, auditorias, achados e observações podem ser preservados sem criar
      revisão quando não houver materialização.
    decision_refs:
      - DEC-005
    acceptance_criteria:
      - Toda mutação confirmada e persistida gera nova revisão do curso.
      - Propostas rejeitadas ou reformuladas não geram revisão do curso.
      - O processo deliberativo pode ser relacionado à revisão que eventualmente produziu.

  - id: PROV-002
    type: governance
    title: Definir licenciamento explícito de cursos e recursos educacionais
    status: captured
    summary: >-
      O projeto distingue a licença do software e da documentação dos termos aplicáveis
      aos conteúdos educacionais. Recursos educacionais abertos podem adotar licenças
      próprias, inclusive CC BY-SA 4.0 quando escolhida, mas nenhuma licença aberta deve
      ser imposta automaticamente a conteúdos criados por usuários ou sujeitos a
      restrições institucionais. Materiais de terceiros conservam seus termos originais.
    next_action: >-
      Definir como os termos de cada curso ou recurso serão selecionados, registrados e
      apresentados, incluindo autoridade para a escolha e tratamento de materiais de
      terceiros ou restritos, antes de aprovar comportamento do produto.

  - id: PROV-003
    type: governance
    title: Resolver titularidade, proteção formal e uso da identidade do ARA
    status: captured
    summary: >-
      O nome ARA, a expressão Plataforma ARA, a expansão Ambiente de Recursos de
      Aprendizagem, o kanji, o logotipo e a identidade visual não são concedidos pelas
      licenças de software ou documentação. O projeto não declara atualmente esses sinais
      como marcas registradas e o símbolo ® não deve ser usado. A análise futura deve
      manter inventário datado dos antecedentes e demais ativos preexistentes relevantes,
      incluindo AraLearn e AraTalk, e esclarecer quando necessário possíveis vínculos
      universitários, empregatícios ou de terceiros, sem presumir conclusão de titularidade.
      Correspondência institucional sensível não integra a documentação pública. Usos
      descritivos não devem sugerir patrocínio, certificação, endosso ou caráter oficial inexistentes.
    next_action: >-
      Inventariar ativos preexistentes e evidências datadas, esclarecer titularidade e
      vínculos aplicáveis, realizar buscas formais de marcas e decidir eventual registro
      no Brasil e na Europa antes de alterar a política pública de identidade. Obter revisão
      qualificada quando a questão exigir conclusão jurídica.

  - id: VER-002
    type: product
    title: Definir escalas de histórico, checkpoints e restauração
    status: pending_research
    summary: >-
      A decisão vigente de proveniência estabelece que toda mutação confirmada e
      persistida cria uma nova revisão do curso. Ainda é necessário definir a fronteira
      entre diário local e undo/redo, checkpoints automáticos não promovidos e revisões
      duráveis navegáveis. Uma revisão durável deve representar um estado lógico completo
      do curso sem obrigar cópia física integral de tudo o que não mudou. A restauração
      não destrutiva, em que restaurar cria um novo descendente e preserva caminhos
      posteriores, permanece uma direção histórica a validar e aprovar explicitamente.
    next_action: >-
      Definir gatilhos e retenção de checkpoints, promoção a revisão durável, restauração,
      consolidação com múltiplos pais, falhas e relação com edição local, sincronização e
      funcionamento offline antes de aprovar comportamento adicional de versionamento.

  - id: PROV-004
    type: governance
    title: Definir proveniência operacional mínima e retenção sustentável
    status: pending_research
    summary: >-
      Investigar um registro operacional que preserve fatos observáveis disponíveis ao
      sistema, como ator, agente e configuração efetiva, revisão-base, alvos, operação,
      autorização, validação, diferença e revisão resultante, sem exigir que a inteligência
      artificial redija a própria contabilidade histórica. Separar esses fatos de análises
      posteriores sobre autoria, agência ou qualidade e não produzir percentuais automáticos
      de autoria. A retenção deve distinguir evidência durável necessária, conteúdo
      configurável e estado transitório ou local; conversas, contexto recuperado e telemetria
      não devem ser retidos indiscriminadamente nem transformados em dados de pesquisa sem
      finalidade e protocolo apropriados.
    next_action: >-
      Definir fatos mínimos, relações, públicos, sensibilidade, prazos, referências de
      retenção, direitos de revisão e regras para uso em pesquisa antes de aprovar schemas,
      receipts, políticas de coleta ou períodos de armazenamento.

  - id: PED-001
    type: research
    title: Decompor finalidade, demanda, resposta e avaliação da prática
    status: pending_research
    summary: >-
      Investigar um modelo no qual finalidade da prática, demanda cognitiva, forma
      da resposta, validade da entrada, autoridade de avaliação e política de crédito
      permaneçam dimensões distintas. O mesmo controle visual pode servir a estudo,
      diagnóstico, avaliação formativa, avaliação somativa ou condição de pesquisa,
      sem produzir interpretações equivalentes.
    next_action: >-
      Definir termos, valores candidatos, interações e critérios para distinguir prática de aprendizagem, medição e decisão consequencial.

  - id: PED-002
    type: research
    title: Modelar o ciclo de tentativa, retorno pedagógico e revelação
    status: pending_research
    summary: >-
      Tratar limite de tentativas, informação entre tentativas, alvo da nova tentativa,
      acesso a pistas, gatilho e conteúdo de revelação, resultado, conteúdo, momento
      e persistência do retorno pedagógico como dimensões relacionadas, mas independentes.
      As fontes não sustentam uma regra universal de retorno imediato ou atrasado,
      tentativa única ou ilimitada, nem revelação sempre disponível ou sempre bloqueada.
    next_action: >-
      Comparar sequências por finalidade, domínio, conhecimento prévio, complexidade, acessibilidade e consequência antes de recomendar perfis.

  - id: PED-003
    type: governance
    title: Registrar restrições de interpretação para respostas e resultados
    status: captured
    summary: >-
      Preservar a distinção entre efeito de prática, aprendizagem, validade de medida,
      usabilidade, carga cognitiva e preferência. Escores de formatos diferentes não
      são intercambiáveis sem calibração. Conclusão estrutural, número de tentativas,
      tempo e uso de pistas não demonstram automaticamente domínio, esforço, atenção,
      habilidade ou dificuldade.
    next_action: >-
      Transformar as restrições em critérios para pesquisa, análises de dados, relatórios, comparação de condições e futuras decisões de produto.

  - id: PED-004
    type: accessibility
    title: Investigar acessibilidade estrutural de respostas e retorno pedagógico
    status: pending_research
    summary: >-
      Examinar controles por teclado e tecnologia assistiva, identificação acessível
      de erros, preservação da entrada, foco e anúncios previsíveis, formas alternativas
      de expressão, políticas de tempo e documentação de eventual mudança do construto.
      Dados de acomodação são sensíveis e não constituem análises de dados comuns.
    next_action: >-
      Definir invariantes e critérios de avaliação por família de interação, dispositivo, modalidade e consequência.

  - id: PED-005
    type: research
    title: Comparar perfis educacionais sem universalizar a referência inicial
    status: captured
    summary: >-
      Usar a experiência anterior como perfil coerente de estudo autodirigido,
      priorização de dispositivos móveis, funcionamento sem conexão, caráter não
      punitivo e ausência de telemetria de tentativas, sem tratá-la como padrão
      universal. Comparar alternativas para estudo com critério local de domínio,
      curso formativo, avaliação institucional, condição de pesquisa e sobreposição
      de acessibilidade, mantendo explícitas autoridade e consequência.
    next_action: >-
      Avaliar objetivos, direitos, riscos, evidência, custos e compatibilidade entre perfis antes de qualquer aprovação.

  - id: PED-006
    type: research
    title: Distinguir progressão estrutural de alegações de domínio
    status: pending_research
    summary: >-
      Separar estados de continuidade e conclusão estrutural de alegações como
      proficiência ou domínio. Qualquer progressão por critério deve declarar a base
      de evidência, o critério versionado, o escopo da alegação, a remediação,
      as exceções autorizadas e a política de rechecagem. Não existe limiar universal.
    next_action: >-
      Comparar critérios e evidências por domínio, horizonte de retenção, contexto educacional, carga de trabalho, acessibilidade e consequências.

  - id: PED-007
    type: research
    title: Modelar autoridade sobre sequência, ritmo e pré-requisitos
    status: pending_research
    summary: >-
      Distinguir quem define a ordem, quem controla o ritmo, como funcionam
      pré-requisitos, ramificações e exceções, e quais escolhas permanecem disponíveis
      ao estudante. Controle compartilhado é uma recomendação a investigar, não
      autorização para sequência adaptativa invisível nem para bloqueios irreversíveis.
    next_action: >-
      Avaliar estruturas autorais, escolhas do estudante, políticas institucionais, condições de pesquisa, remediação, contestação e caminhos acessíveis.

  - id: PED-008
    type: research
    title: Investigar revisão espaçada, intercalação e carga
    status: pending_research
    summary: >-
      Representar separadamente gatilho de revisão, agenda, padrão de intervalos,
      horizonte de retenção, orçamento de carga, adiamento, relação entre itens e
      tratamento após dificuldade. Espaçamento e intercalação possuem mecanismos
      distintos, e as fontes não sustentam algoritmo, intervalo ou mistura universais.
    next_action: >-
      Comparar agendas e políticas por objetivo, domínio, similaridade entre categorias, tempo disponível, funcionamento offline e possibilidade de adiamento sem coerção.

  - id: PED-009
    type: research
    title: Investigar exemplos, apoio instrucional, segmentação e retomada
    status: pending_research
    summary: >-
      Examinar disponibilidade, posição e completude de exemplos, tipos e acesso a
      apoios instrucionais, retirada gradual e reversível de apoio, segmentação
      semanticamente coerente e suporte determinístico à retomada após interrupções.
      Apoio para novatos deve conduzir à prática independente sem retirar informação essencial.
    next_action: >-
      Avaliar combinações por nível de experiência, domínio, complexidade, dispositivo, acessibilidade, estudo fragmentado e necessidade de restaurar apoio.

  - id: PED-010
    type: research
    title: Investigar autonomia apoiada, adaptação e assistência por inteligência artificial
    status: pending_research
    summary: >-
      Separar autonomia, autorregulação, adaptação, acessibilidade e assistência por
      inteligência artificial. Recomendações e mudanças devem explicitar alvo,
      evidência, autoridade, confirmação, transparência, exceção autorizada, reversão,
      registro do estado efetivo e comportamento alternativo. A IA permanece assistente
      e não se torna autoridade educacional, avaliadora ou publicadora por padrão.
    next_action: >-
      Investigar funções delimitadas, preservação da operação cognitiva, salvaguardas,
      contestação, privacidade, funcionamento sem conexão e critérios para regras
      determinísticas ou aplicação humana confirmada.

  - id: PED-011
    type: research
    title: Usar a formação acadêmica como orientação, não como evidência de eficácia
    status: captured
    summary: >-
      Organizar temas, métodos e bibliografias das unidades curriculares relacionadas
      ao projeto para orientar perguntas e revisões futuras. Ementas e bibliografias
      de disciplinas não substituem revisões da literatura, não confirmam requisitos
      e não autorizam implementar um tema apenas porque ele aparece na formação.
    next_action: >-
      Verificar referências, classificar obras por frente temática e relacioná-las a construtos, instrumentos, parâmetros ou questões de pesquisa.

  - id: AGENT-001
    type: research
    title: Investigar configuração modular de agentes e análise assistida
    status: captured
    summary: >-
      Investigar perfis e versões de agentes, papéis e autoridade, perfis de domínio,
      coleções de conhecimento, modelos de tarefa, fronteiras entre prompts, recursos
      e ferramentas, políticas de contexto e escrita, snapshots efetivos, avaliações
      de regressão, taxonomia de falhas, observações, reparo e reauditoria, métodos
      quantitativos, qualitativos e mistos, reprodutibilidade e direitos dos participantes.
      A inteligência artificial permanece assistente, não aprovadora ou autoridade científica.
    next_action: >-
      Separar os subproblemas por decisão, evidência necessária e domínio, preservando privacidade, proveniência e controle humano.

  - id: RES-001
    type: research
    title: Estruturar o programa de levantamento bibliográfico
    status: captured
    summary: >-
      Organizar perguntas, estratégias de busca, bases, corpus, critérios de seleção,
      sínteses, limitações e relações entre evidências e decisões de produto.
    next_action: Definir o primeiro conjunto de questões de pesquisa e o formato do registro bibliográfico.

  - id: RES-002
    type: research
    title: Organizar evidências por autoridade, procedência e estabilidade temporal
    status: captured
    summary: >-
      Distinguir observação de sistemas e experiências anteriores, documentação e
      padrões oficiais, literatura acadêmica e baselines conceituais do projeto.
      Registrar escopo, autoridade e data de acesso. Preços, quotas, capacidades de
      serviços e outras informações instáveis devem ser revalidados antes de decisão.
    next_action: >-
      Definir campos mínimos de procedência e critérios para atualização de evidências temporais.

  - id: RES-003
    type: research
    title: Resolver incertezas que podem alterar o recorte do produto
    status: pending_research
    summary: >-
      Verificar compreensão de perfis por públicos distintos, capacidade de geração
      e reparo localizado, desempenho em dispositivos modestos, requisitos de
      instituições representativas, acessibilidade de interações avançadas e o caso
      acadêmico ou curso que poderá determinar prioridades do primeiro recorte.
    next_action: >-
      Transformar cada incerteza em pergunta verificável, método, critério de mudança de decisão e destino no backlog.

  - id: VAL-001
    type: validation
    title: Construir corpus representativo de cursos, estados e falhas
    status: captured
    summary: >-
      Preparar casos simples e complexos que cubram recursos educacionais relevantes,
      contextos pessoais e colaborativos, publicação, funcionamento offline,
      interrupções, conflitos, capacidades indisponíveis e falhas recuperáveis.
      O corpus servirá a avaliações futuras, não constitui validação por si só.
    next_action: >-
      Definir critérios de representatividade, procedência, anonimização, versões e usos permitidos.

  - id: VAL-002
    type: validation
    title: Definir estados e evidências da validação
    status: captured
    summary: >-
      Investigar separadamente validade da entrada, satisfação de critérios,
      disponibilidade da capacidade necessária, autoridade responsável pela conclusão
      e evidências produzidas pela validação. Definir também quem pode ver essas
      evidências, por quanto tempo permanecem, quando precisam ser ocultadas ou
      redigidas e como suportam revisão e contestação. Valores usados em protótipos
      são exemplos experimentais, não políticas aprovadas.
    next_action: >-
      Relacionar estados, públicos, sensibilidade, reprodutibilidade, privacidade,
      funcionamento offline e direitos de revisão antes de definir contratos ou políticas.

  - id: INF-001
    type: technical
    title: Investigar infraestrutura e factibilidade
    status: captured
    summary: >-
      Examinar armazenamento, banco de dados, versionamento, sincronização,
      funcionamento offline, backup, restauração, portabilidade, custo,
      desempenho e possíveis cenários de adoção institucional. Para o histórico de
      versões, permanecem alternativas a comparar: sobrescrita com logs, snapshots
      completos no banco ou em armazenamento de objetos, objetos endereçados por
      conteúdo com manifests, deltas ou patches, event sourcing integral, versionamento
      nativo do armazenamento, linhas temporais, Git verdadeiro e camadas semelhantes a
      Git sobre armazenamento de objetos. Nenhuma dessas alternativas está selecionada.
    next_action: >-
      Comparar as alternativas com workloads representativos, simplicidade, custo de
      leitura e escrita, integridade, backup e restauração, funcionamento offline,
      portabilidade, quantidade de objetos, índices e capacidade institucional antes
      de qualquer decisão de arquitetura, provedor ou schema físico.

  - id: EXP-001
    type: research
    title: Manter auditoria verificável da referência funcional AraLearn
    status: captured
    summary: >-
      Registrar capacidades por camadas de autoridade, distinguindo contrato e
      documentação, código executável, validadores, renderização, testes e exemplos.
      Capacidades apenas documentadas, inferidas ou propostas não devem ser
      apresentadas como implementadas.
    next_action: >-
      Definir um formato público resumido para evidências de implementação, conflitos, limitações e grau de confiança.

  - id: EXP-002
    type: product
    title: Avaliar preservação seletiva dos invariantes do AraLearn
    status: pending_research
    summary: >-
      Examinar IDs estáveis, contratos fechados e versionados, separação entre
      semântica e geometria, estudo determinístico sem conexão, estado pessoal
      mínimo, publicação explícita e imutável, fronteira de aplicação para agentes
      e testes reutilizáveis. Esses elementos formam uma referência, não autorização
      para copiar arquitetura, serviços, esquemas ou fluxos anteriores.
    next_action: >-
      Classificar cada invariante como requisito candidato, alternativa, evidência situada, patrimônio de testes ou característica não preservada.

  - id: EXP-003
    type: research
    title: Reclassificar o catálogo legado por responsabilidade educacional
    status: pending_research
    summary: >-
      Tratar o catálogo implementado como baseline verificável, não como ontologia do
      ARA. Separar representação, atividade, resposta, validação, retorno pedagógico,
      composição e capacidade conectada antes de decidir quais conceitos preservar,
      dividir, reformular, especializar ou retirar.
    next_action: >-
      Confrontar as classificações provisórias com evidência por domínio, acessibilidade, uso móvel, funcionamento sem conexão e contratos futuros.

  - id: EXP-004
    type: research
    title: Investigar lacunas demonstradas de resposta e interação
    status: pending_research
    summary: >-
      A referência anterior possui diversidade representacional maior que a diversidade
      de respostas. Investigar construção de grafos e geometrias, manipulação de dados,
      reordenação, execução de código, anotação produzida pelo estudante, respostas
      abertas e validações disciplinares sem presumir uma solução técnica única.
    next_action: >-
      Organizar as lacunas por operação cognitiva, domínio, autoridade de avaliação, acessibilidade, segurança, funcionamento sem conexão e evidência necessária.

  - id: EXP-005
    type: technical
    title: Definir compatibilidade com cursos e dados do AraLearn
    status: captured
    summary: >-
      Não há decisão sobre compatibilidade, importação ou migração. Avaliar leitura
      direta, conversão, importação assistida, preservação somente documental ou
      ausência de compatibilidade, mantendo proveniência, validação e recuperação
      segura diante de conteúdo inválido.
    next_action: >-
      Inventariar formatos e estados relevantes, públicos afetados, custos, riscos de perda e critérios para uma futura decisão explícita.

  - id: EXP-006
    type: research
    title: Usar experiências pessoais como evidência situada
    status: captured
    summary: >-
      Preservar antecedentes de uso e casos negativos como fontes de perguntas e
      hipóteses. Relato pessoal, descrição oficial do produto, estudo independente,
      evidência de eficácia e requisito do ARA permanecem categorias distintas.
      Casos não identificados não recebem atribuição pública.
    next_action: >-
      Relacionar cada antecedente a questões verificáveis, fontes externas pertinentes e limites de generalização.

  - id: EXP-007
    type: research
    title: Tratar sistemas externos como precedentes, não requisitos
    status: captured
    summary: >-
      Usar repositórios, plataformas e bibliotecas para observar modelos de conteúdo,
      resposta, validação, retorno pedagógico, autoria, extensão e execução. Uma
      funcionalidade existente, a popularidade do projeto ou a maturidade técnica
      não demonstram efetividade educacional nem obrigam sua adoção pelo ARA.
    next_action: >-
      Registrar para cada precedente a versão examinada, o papel da fonte, a licença, os limites da auditoria e as condições necessárias antes de qualquer reutilização ou promoção.

  - id: EXP-008
    type: research
    title: Avaliar gramáticas de domínio e primitivas compartilhadas
    status: pending_research
    summary: >-
      Investigar quando estruturas comuns podem compartilhar primitivas sem apagar
      restrições próprias de matemática, programação, circuitos, mapas, música,
      moléculas, simulações, línguas, fontes e outros domínios. Um motor comum não
      torna equivalentes as representações, atividades ou critérios de validação.
    next_action: >-
      Comparar famílias por estado semântico, operação do estudante, validade, correção, acessibilidade, funcionamento sem conexão e risco de falsa generalidade.

  - id: EXP-009
    type: technical
    title: Definir governança de capacidades instaladas
    status: pending_research
    summary: >-
      Avaliar um catálogo versionado de capacidades instaladas e aprovadas, com
      contratos explícitos de representação, resposta, validação, execução,
      acessibilidade, segurança, localização e funcionamento sem conexão. Cursos não
      devem fornecer código arbitrário de componentes como parte do conteúdo.
    alternatives:
      - Manter um catálogo fechado e estático no núcleo.
      - Usar capacidades instaladas e aprovadas com versões e permissões explícitas.
      - Permitir código de componente fornecido pelo curso, alternativa não recomendada pelas fontes atuais.
    next_action: >-
      Comparar segurança da cadeia de fornecimento, licenças, compatibilidade, tamanho, atualização, isolamento, auditoria e experiência de autoria antes de uma decisão arquitetural.

  - id: EXP-010
    type: research
    title: Registrar cobertura representativa e lacunas de validação
    status: captured
    summary: >-
      Tratar a saturação como relativa às decisões examinadas. A amostragem atual
      sustenta ampliar o horizonte além do perfil inicial e evita uma plataforma
      universal sem governança, mas não valida interações avançadas, requisitos
      institucionais, acessibilidade com usuários ou efetividade de capacidades.
    next_action: >-
      Converter lacunas parciais em estudos delimitados, testes com tecnologia assistiva, requisitos institucionais verificáveis e critérios capazes de alterar decisões específicas.

  - id: MODEL-001
    type: product
    title: Definir unidade reutilizável e ocorrência contextual
    status: pending_owner_approval
    summary: >-
      Submeter à aprovação o modelo em que a revisão de uma microssequência é a
      unidade reutilizável inicial de autoria e uma ocorrência contextual a insere
      em uma revisão completa de curso. A proposta é inicial e revisável, não uma
      granularidade universal; ordem, papel, pré-requisitos e ajustes locais pertencem
      ao contexto de uso, não ao conteúdo reutilizável isoladamente.
    alternatives:
      - Usar o card como unidade reutilizável principal.
      - Usar a microssequência como unidade reutilizável inicial.
      - Usar lição ou módulo como unidade reutilizável principal.
      - Permitir identidade reutilizável equivalente em múltiplos níveis desde o início.
    next_action: >-
      Decidir a granularidade inicial após comparar coesão pedagógica, reutilização,
      autoria assistida, reparo localizado, diferenças entre versões e funcionamento sem conexão.

  - id: MODEL-002
    type: product
    title: Definir relações tipadas para dependências e cobertura
    status: pending_owner_approval
    summary: >-
      Submeter à aprovação o uso de identificadores estáveis e relações tipadas,
      versionadas e limitadas ao domínio para representar dependências, cobertura,
      reutilização e relações conceituais. Rótulos e tags livres permaneceriam
      auxiliares de busca, sem constituir o núcleo semântico das dependências.
    alternatives:
      - Representar dependências principalmente por texto livre e tags.
      - Adotar vocabulários tipados, versionados e específicos por domínio.
      - Adotar uma ontologia universal única para todos os domínios.
    next_action: >-
      Decidir a abordagem após testar expressividade, interoperabilidade, autoria,
      manutenção e risco de falsa generalidade em cursos de domínios distintos.

  - id: MODEL-003
    type: product
    title: Separar representação, prática, resposta, validação e retorno pedagógico
    status: pending_owner_approval
    summary: >-
      Submeter à aprovação um modelo em que recurso ou representação, definição da
      prática, forma de resposta, política de validação e política de retorno
      pedagógico sejam responsabilidades distintas e combináveis. A separação é
      coerente com as pendências pedagógicas vigentes, mas ainda não constitui
      contrato de implementação nem catálogo fechado de componentes.
    alternatives:
      - Usar um componente único que concentre representação, interação e correção.
      - Separar todas as responsabilidades em contratos próprios e combináveis.
      - Separar somente as responsabilidades que demonstrarem necessidade concreta.
    next_action: >-
      Decidir a fronteira conceitual antes de especificar contratos técnicos,
      garantindo validade educacional, acessibilidade, geração assistida e simplicidade de autoria.

  - id: MODEL-004
    type: product
    title: Definir propriedade contextual do estado de estudo
    status: pending_owner_approval
    summary: >-
      Submeter à aprovação o princípio de que progresso, retomada e estado funcional
      pertencem ao contexto de estudo que combina estudante, revisão de curso,
      ocorrência e card. Reutilizar o mesmo conteúdo em cursos diferentes não
      transferiria automaticamente domínio, progresso ou outras alegações educacionais.
    alternatives:
      - Associar o estado principalmente ao conteúdo reutilizável, independentemente do curso.
      - Manter estado contextual por curso e ocorrência, sem transferência automática.
      - Permitir equivalência explícita posterior baseada em evidência e política aprovadas.
    next_action: >-
      Decidir a regra de identidade do estado e separar continuidade funcional de
      quaisquer alegações de domínio, equivalência ou aprendizagem entre contextos.

  - id: MODEL-005
    type: product
    title: Organizar bibliotecas e coleções por referências sem cópia implícita
    status: pending_owner_approval
    summary: >-
      Submeter à aprovação o princípio de que pastas, coleções, programas e catálogos
      organizem referências a cursos ou publicações sem criar cópias ocultas nem
      alterar a identidade pedagógica do curso. Cópia, derivação e adaptação devem
      permanecer operações explícitas e distinguíveis da simples organização.
    alternatives:
      - Fazer a organização criar cópias independentes automaticamente.
      - Organizar por referências, exigindo operação explícita para copiar ou derivar.
      - Permitir semânticas diferentes de organização por perfil ou contexto.
    next_action: >-
      Decidir a semântica de referência após avaliar autoria, proveniência,
      versionamento, compartilhamento, funcionamento sem conexão e expectativas dos usuários.

  - id: AUTH-001
    type: product
    title: Definir ciclo governado de autoria assistida, auditoria e reparo
    status: pending_research
    summary: >-
      Formalizar um ciclo em que planejamento e propostas permanecem deliberativos até
      decisão humana; a construção materializa somente partes autorizadas; a auditoria
      examina uma revisão persistida sem alterá-la; o reparo depende de autorização e
      escopo; e a reauditoria verifica a nova revisão. A inteligência artificial pode
      atuar em papéis distintos, mas aprovação e publicação permanecem sob controle
      humano explícito. Um levantamento comparativo de 43 registros, entre experiência
      de desenvolvimento, padrões e orientações oficiais, sistemas implementados e
      literatura acadêmica, sustenta a separação das etapas sem estabelecer um fluxo universal.
    next_action: >-
      Comparar o perfil de referência com autoria manual, autoria pessoal assistida,
      equipes, pesquisa e contextos institucionais, definindo invariantes e pontos de variação.

  - id: AUTH-002
    type: governance
    title: Definir identidade, papel, contribuição e autoridade na autoria
    status: pending_research
    summary: >-
      Representar separadamente identidade do participante ou agente, papel operacional,
      atividade realizada, alvo e revisão, contexto utilizado, autoridade exercida e
      estado produzido. Uma mesma pessoa ou agente pode assumir papéis diferentes em
      momentos distintos sem herdar automaticamente permissões. Contribuições observáveis
      devem ser registráveis sem reduzir a autoria a um rótulo humano versus IA, sem
      percentuais automáticos de autoria e sem inferir passividade, criticidade ou dependência.
    next_action: >-
      Definir a taxonomia mínima de papéis e contribuições, distinguindo atribuição,
      responsabilidade, autoria jurídica, privacidade, proveniência e apresentação compreensível.

  - id: CUR-001
    type: governance
    title: Definir revisão, achados, reparo e reauditoria por escopo e risco
    status: pending_research
    summary: >-
      Separar validação estrutural, revisão ou auditoria, aprovação e publicação.
      Achados devem identificar alvo, critério, impacto, recomendação e estado; reparos
      exigem autoridade e escopo explícitos e não podem ampliar silenciosamente a mudança.
      Alterações semânticas geram nova revisão e podem exigir verificação de regressões
      e reauditoria. Independência, qualificação do revisor e separação de deveres devem
      variar conforme risco e contexto, sem tratar assistência por IA como substituta
      automática de especialistas em decisões críticas.
    next_action: >-
      Comparar rubricas, tipos de revisão, qualificações, gravidade, regras de aprovação
      e gatilhos de reauditoria para uso pessoal, pesquisa, publicação e contextos institucionais.

  - id: CUR-002
    type: product
    title: Definir observações situadas e resolução rastreável
    status: pending_research
    summary: >-
      Modelar observações com alvo e revisão recuperáveis, motivação, visibilidade e
      estado próprios. Responder a uma observação não deve resolvê-la automaticamente;
      a resolução precisa apontar para decisão, alteração, achado ou revisão pertinente.
      Observações podem orientar triagem, curadoria e reparo, mas não constituem votos,
      verdade automática nem medida da competência de quem produziu o artefato.
    next_action: >-
      Comparar alvos, seletores, ciclo de vida, permissões, privacidade, acessibilidade
      e relações com achados, reparos e histórico deliberativo.

  - id: PUB-001
    type: governance
    title: Definir estados, audiência e gates de publicação
    status: pending_research
    summary: >-
      Distinguir estado editorial de visibilidade e audiência: rascunho, prévia, pronto,
      aprovado, publicado, retirado, substituído e arquivado não são equivalentes, e
      publicado não significa necessariamente público. Gates podem combinar validação
      estrutural, auditoria, aprovação humana, licença, acessibilidade, confidencialidade,
      protocolo e política institucional. Retirada, supersessão, arquivamento e exclusão
      precisam de semânticas próprias, sem mutação silenciosa de versões publicadas nem
      propagação automática de mudanças para consumidores.
    next_action: >-
      Comparar perfis pessoais, de equipe, pesquisa, instituição, recursos educacionais
      abertos e conteúdo confidencial, incluindo autoridade, retenção, rollback,
      licenciamento, cópias offline e consequências para reutilização.

  - id: ACCESS-001
    type: governance
    title: Definir visibilidade, audiência e acesso em derivações
    status: pending_research
    summary: >-
      Investigar uma superfície cotidiana simples de visibilidade e audiência, incluindo
      as alternativas Público, Privado e pessoas ou grupos autorizados, sem transformar
      essa formulação histórica em política aprovada. O modelo candidato de acesso
      derivacional propõe que descendentes possam restringir, mas não ampliar
      silenciosamente, a audiência permitida pelas origens necessárias; múltiplos pais
      e contêineres poderiam compor restrições, e revogações poderiam bloquear
      descendentes sem apagar a trajetória. A comparação encontrou precedentes para
      mecanismos parciais de teto hierárquico, atenuação, interseção e autorização
      relacional, mas não valida o modelo integral. Em particular, bloquear o próprio
      autor de um descendente após revogação ancestral permanece hipótese de desenho.
    alternatives:
      - Tratar a visibilidade de cada revisão de forma independente, sem teto herdado.
      - Adotar atenuação monotônica pelas origens necessárias, sem exceção automática de autoria.
      - Permitir ampliação somente por uma autoridade de desclassificação explicitamente definida.
    next_action: >-
      Validar os cenários de derivação, múltiplos pais, grupos dinâmicos, revogação,
      reativação, metadata de nós bloqueados, cópias offline, snapshots de pesquisa,
      requisitos institucionais, privacidade, propriedade, licenciamento, desempenho e
      usabilidade antes de decidir modelo de autorização, padrão de visibilidade,
      exceções, schema, tecnologia ou política de retenção.

  - id: ACCESS-002
    type: governance
    title: Definir autenticação, contexto colaborativo e autorização conectada
    status: pending_research
    summary: >-
      Investigar uma arquitetura em que autenticação de identidade e autorização sobre
      conteúdo e operações permaneçam separadas. A fonte histórica propõe identidade
      federada para ações conectadas, contexto explícito de organização ou espaço
      colaborativo, mínimo privilégio e negação por padrão, papéis e capacidades locais,
      revogação e mudanças de participação aplicadas nas fronteiras conectadas e
      permissões específicas para conteúdo confidencial, pesquisa e exportação.
      Identificadores duráveis do domínio não deveriam depender de identificadores de
      provedor, e o modo pessoal offline poderia operar sem provedor de identidade até
      exigir uma ação conectada. Esses elementos são candidatos, não política aprovada.
    alternatives:
      - Delegar autenticação a um provedor compatível e manter autorização de domínio na aplicação.
      - Avaliar papéis, capacidades e políticas locais, com controles de infraestrutura apenas como defesa adicional.
      - Avaliar outros modelos de autorização que preservem mínimo privilégio, revogação e portabilidade sem acoplamento ao provedor de identidade.
    next_action: >-
      Confrontar OIDC, papéis e capacidades locais, avaliação de políticas, controles
      como Row-Level Security, modos gerenciados e autogerenciados, revogação, convites,
      funcionamento offline e requisitos de conteúdo confidencial e pesquisa antes de
      decidir provedor de identidade, modelo de autorização, schema ou mecanismo de aplicação.

  - id: PARAM-001
    type: research
    title: Definir taxonomia versionada e maturidade dos parâmetros configuráveis
    status: pending_research
    summary: >-
      Investigar uma taxonomia versionada que mantenha separadas possibilidades descobertas,
      definições conceituais, evidências mapeadas, candidatos, recomendações e decisões
      aprovadas. Cada parâmetro candidato precisa explicitar finalidade, escopo, relação com
      a configuração de referência, alternativas, fontes, autoridade, dependências,
      incompatibilidades, estado da evidência, riscos e situação decisória. A experiência
      anterior permanece perfil de referência e fonte de contraste, não limite da taxonomia
      nem configuração universal. Os catálogos e rótulos históricos de aceitação não são
      requisitos vigentes e não autorizam expor toda possibilidade no produto.
    next_action: >-
      Confrontar os registros estruturados do domínio, deduplicar parâmetros já destinados
      a pedagogia, autoria, dados, acesso e publicação e definir quais dimensões merecem
      permanecer como candidatos antes de qualquer aprovação de identificadores, namespaces,
      valores, defaults, catálogo ou contrato de configuração.

  - id: PARAM-002
    type: product
    title: Definir perfis, sobreposições, precedência e configuração efetiva reproduzível
    status: pending_research
    summary: >-
      Investigar a proposta histórica de resolver configuração por combinação versionada
      de taxonomia, perfil-base, sobreposições, políticas e bloqueios de maior autoridade,
      exceções delimitadas, versões de conteúdo e composição e estado de capacidades,
      produzindo um snapshot efetivo determinístico e reproduzível. Perfis nomeados e
      sobreposições esparsas são alternativas para reduzir complexidade sem universalizar
      a configuração de referência. Autoridade normativa deve permanecer distinta de
      disponibilidade técnica: capacidade indisponível precisa ser explícita e qualquer
      comportamento alternativo deve ser previamente autorizado. A ordem histórica de
      precedência entre direitos e acessibilidade, consentimento, protocolo de pesquisa,
      políticas institucionais, curso, escolhas do estudante, adaptação e assistência por
      inteligência artificial permanece candidata, não regra aprovada.
    next_action: >-
      Validar cenários com preferências conflitantes, bloqueios de pesquisa, restrições
      institucionais, acomodações de acessibilidade, funcionamento offline e capacidades
      indisponíveis; comparar perfis, sobreposições, locks, overrides, fallback, cópia,
      comparação e versionamento de snapshots antes de decidir modelo de precedência,
      defaults, schema, UI, mecanismo adaptativo ou implementação.

  - id: DATA-001
    type: research
    title: Definir protocolos, condições e atribuição reproduzíveis
    status: pending_research
    summary: >-
      Investigar uma cadeia versionada que mantenha separadas pergunta e finalidade,
      protocolo, condição e atribuição, evento autorizado ou instrumento, evidência,
      medida, construto, interpretação e decisão ou intervenção. Condições candidatas
      podem precisar registrar versões de conteúdo, composição e configuração efetiva,
      capacidades, instrumentos, autorizações de eventos, dimensões bloqueadas,
      acomodações exigidas por direitos, desvios e limitações de comparabilidade.
      Termos metodológicos como randomizado, contrabalanceado, quase experimental ou
      causal dependem dos respectivos requisitos de desenho e não decorrem do software.
    next_action: >-
      Confrontar os conceitos históricos com estudos entre participantes,
      intraparticipante, qualitativos, mistos, de desenvolvimento e uso offline,
      articulando PARAM-001, PARAM-002, VAL-001 e direitos de acessibilidade antes de
      aprovar objetos, campos, snapshots, estados ou contratos de protocolo.

  - id: DATA-002
    type: governance
    title: Definir governança de dados e direitos de participantes
    status: pending_research
    summary: >-
      Investigar finalidade explícita, minimização, modo de identidade,
      pseudonimização, consentimento quando aplicável, retirada, retenção, acesso,
      exportação, uso secundário, tratamento de dados sensíveis, transparência ao
      participante e resposta a incidentes. Dados pseudonimizados não devem ser
      tratados automaticamente como anônimos. Logs operacionais e evidência de pesquisa
      precisam permanecer separados por finalidade e autoridade. Nenhuma base jurídica,
      política de retenção ou regra de eliminação está aprovada de forma universal.
    next_action: >-
      Mapear classes de dados, finalidades, atores, públicos, sensibilidade, contextos
      institucionais e jurisdições; confrontar cenários de retirada, acessibilidade,
      pesquisa offline, exportação e uso secundário e obter revisão ética ou jurídica
      qualificada quando necessária antes de aprovar políticas ou implementação.

  - id: DATA-003
    type: research
    title: Definir instrumentação, medidas, analytics e interoperabilidade de pesquisa
    status: pending_research
    summary: >-
      Investigar um vocabulário versionado em que disponibilidade técnica não autorize
      coleta e em que eventos, instrumentos, medidas, construtos e interpretações
      mantenham responsabilidades distintas. Cada medida candidata deve declarar
      pergunta, fórmula, denominador quando aplicável, unidade, unidade de análise,
      janela, entradas, tratamento de dados ausentes, limitações e uso permitido.
      Analytics pessoais, pedagógicos, de pesquisa e operacionais possuem finalidades,
      visibilidade e autoridade diferentes. Caliper, xAPI, QTI, DDI, PROV-O, RO-Crate
      e DPV permanecem mapeamentos candidatos, não a semântica interna do ARA.
    alternatives:
      - Manter vocabulário interno mínimo com mapeamentos versionados para padrões externos.
      - Adotar um padrão externo como representação interna principal.
      - Usar vocabulários específicos por finalidade e definir pacotes explícitos de interoperabilidade.
    next_action: >-
      Revisar os vinte e quatro eventos, dezesseis medidas e quatorze famílias de
      instrumentos históricos contra perguntas representativas, PED-003, PROV-004,
      privacidade, funcionamento offline e equivalência entre implantações; definir
      critérios de conformidade sem aprovar event store, LRS, warehouse, dashboard,
      modelo preditivo, schema, padrão obrigatório ou implementação.

  - id: SYNC-001
    type: technical
    title: Definir materialização, atualização e recuperação offline
    status: pending_research
    summary: >-
      Investigar como conteúdo, capacidades e estado funcional necessários a um uso
      offline podem ser materializados e atualizados sem destruir a última versão local
      válida diante de interrupção, corrupção, insuficiência de armazenamento ou falha de
      ativação. Origem ou publicação, cópia local, atualização pendente e remoção local
      precisam permanecer distinguíveis, e consequências de perda ou limpeza devem ser
      explícitas. Materialização atômica e preservação da versão anterior são candidatos
      de comportamento a validar, não escolha de mecanismo físico.
    next_action: >-
      Definir classes de estado local, invariantes de ativação e rollback, falhas de
      download ou importação, pressão de armazenamento, diagnóstico, exportação e
      reabertura sem conexão; confrontar pacotes representativos e dispositivos antes de
      aprovar formato, armazenamento local, cache, limiares, interface ou implementação.

  - id: SYNC-002
    type: technical
    title: Definir sincronização, idempotência e conflitos sem perda silenciosa
    status: pending_research
    summary: >-
      Investigar sincronização de objetos versionados, estado funcional e operações
      autorizadas preservando intenção local, divergências e autoridade. Repetições e
      retries não devem aplicar silenciosamente o mesmo efeito duas vezes quando a
      operação exigir idempotência; conflitos relevantes precisam permanecer explícitos
      e recuperáveis. Merge determinístico pode ser adequado somente onde a semântica da
      classe de dado estiver definida. O corpus não sustenta merge semântico silencioso,
      mas também não aprova uma proibição universal de CRDTs ou de qualquer família de
      algoritmos. Outbox, receipts, revisão esperada e compare-and-set são alternativas
      históricas, não contratos vigentes.
    alternatives:
      - Usar operações versionadas e idempotentes com fila local e detecção explícita de revisão divergente.
      - Sincronizar estado por classe de dado com políticas de merge determinístico explicitamente definidas.
      - Avaliar engines ou algoritmos especializados que preservem os mesmos invariantes sem impor semântica inadequada.
    next_action: >-
      Definir classes de dados e operações, garantias de identidade, ordenação, retry e
      idempotência, taxonomia de conflitos, preservação e exportação de intenção local,
      revogação, retirada de publicação e estados offline; comparar protocolos, CRDTs e
      outros mecanismos somente depois da semântica, acessibilidade e cenários de falha,
      sem selecionar engine, transporte, provider, schema ou interface de conflito.
